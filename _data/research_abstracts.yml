alekseev_vasiliy__phd:
  kind: abstract
  source: https://aclanthology.org/2020.lrec-1.833.pdf
  text: This paper introduces TopicNet, a new Python module for topic modelling. This package, distributed under the MIT license, focuses on bringing additive regularization for topic modelling (ARTM) to non-specialists using a general-purpose high-level language. The module features include powerful model visualization techniques, various training strategies, semi-automated model selection, support for user-deﬁned goal metrics, and a modular approach to topic model training.
alexander_astakhov__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/AleksandrAstakhov/dynamic-systems/dev/docs/thesis.pdf
  text: Работа посвящена снижению размерности латентного пространства в задачах прогнозирования распределённых динамических систем по данным сети датчиков. Цель— снижение размерности латентного пространства динамической системы и построение в редуцированном пространстве оператора связности, способного описывать направленные взаимодействия между датчиками. Задачи:показатьпринципиальноеограничениесимметричныхмоделейоператора связности; построить низкоразмерное представление состояния системы через вложение Такенса; предложить параметризацию оператора в редуцированном пространстве, не ограниченную симметрийным классом; экспериментально подтвердить результаты на синтетических и реальных данных. Результаты.На синтетической системе с заведомо асимметричным оператором модель снижает ошибку прогноза на 11,1% относительно симметричной базовой модели и восстанавливает направленность переноса. На данных ЭЭГ моторного воображения прирост составляет 6,8%. Рекомендации.Модель рекомендуется для задач прогнозирования
    в системах с направленной связностью (нейрофизиология, транспорт, климат) и может быть использована как предиктивная компонента в контурах управления. 2 Снижение размерности латентного пространства в задачах управления
alexander_bogdanov__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Bogdanov-BS-Thesis/main/paper/BachelorThesis_paper.pdf
  text: В данной работе рассматривается проблема оптимизации «черного ящика». В такой постановке задачи нет доступа к градиенту целевой функции, поэтому его необходимо каким-либо образом оценить. Предлагается новый способ аппроксимации градиентаJAGUAR, который запоминает информацию из предыдущих итераций и требуетO(1) обращений к оракулу. Эта аппроксимация адаптирована для алгоритма Франка-Вульфа, в частности доказана сходимость для выпуклой постановки задачи. Анализируются как детерминированная постановка задачи минимизации, так и стохастическая на выпуклом ограниченном множестве Q с шумом в оракуле нулевого порядка, такая постановка довольно непопулярна в литературе. Но было доказано, чтоJAGUAR является робастной и в таком случае. Проведенные эксперименты показывают, что JAGUAR превосходит уже известные в литературе методы оценки градиента.
alexander_kolesov__master:
  kind: abstract
  source: https://raw.githubusercontent.com/justkolesov/Optimal-Transfer-Learning/main/Thesis_Kolesov.pdf
  text: Inductive transfer learning aims at adapting a pre-trained neural network to target data without access to a source database. Most modern methods suﬀer from strong regularization between corresponding parameters. An eﬃcient inductive transfer learning method should take enough information from a pre-trained model, but also learn vital patterns from new data. We present the novel technique of transfer learning that is based on optimal transport theory. However, this method requires deep neural networks(DNN) that are strongly 1— Lipschitz continuity functions in according to the theory. To solve this issue, we develop such networks and prove necessary theoretical guarantees for them. We show, that the regularization of the proposed method computes ground-truth the Wasserstein-1 distance between distributions of parameters, while another penalization strategies compute an upper bound. We demonstrate the abilities of the proposed method and compare it with relevant transfer learning
    techniques.
