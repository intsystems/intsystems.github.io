alexey_kravatskiy__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Kravatskiy-BSc-Thesis/main/paper/ky_fan_thesis.pdf
  text: В настоящей работе исследуется применение различных матричных норм для оптимизации функций матриц весов, что является ключевой задачей при обучении глубоких нейросетей. Проводится поиск альтернатив спектральной норме для создания алгоритмов оптимизации в рамках подходаnorm-constrained linear minimization oracle (LMO). При помощи данного подхода в 2025 году научным сообществом уже были получены высокоэффективные алгоритмы для обучения глубоких нейронных сетей Muon и Scion, которые, однако, опирались именно на спектральную норму. На основе норм, двойственных к нормам Ки Фана, вводится семейство алгоритмовFanions, связанных с алгоритмами Muon, ν-SAM и Dion, а также семейства алгоритмовF-FanionsиS-Fanions, обновления которых представляют собой конические комбинации обновлений алгоритмов Fanions и Normalized SGD или SignSGD соответственно. Наиболее успешными на практике алгоритмами в данных семействах являются Muon, F-Muon и S-Muon. По результатам обширного эмпирического исследования
    всех трёх семейств алгоритмов показывается, что F-Muon и S-Muon не уступают Muon на задачах глубокого обучения и превосходят его на синтетической гладкой выпуклой задаче.
alexey_rebrikov__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Rebrikov-BS-Thesis/master/paper/main.pdf
  text: 'В современном мире машинное обучение невозможно представить без использования больших обучающих выборок и моделей. Это обусловило широкое применение стохастических методов обучения, таких какSGD. Несмотря на простоту,SGD обладает слабыми теоретическими гарантиями сходимости, связанными с неубывающей дисперсией. Данная проблема может быть частично устранена с помощью модификаций, таких какSARAH. Однако эти методы требуют периодического вычисления полного градиента, что может быть затратным по времени. В данной работе были рассмотрены варианты алгоритмов с уменьшением дисперсии, не предполагающие необходимость вычисления полного градиента. Для повышения эффективности по памяти и исключения этих вычислений были использованы два ключевых подхода: эвристика перемешивания и идея, лежащая в основе методовSAG/SAGA. В результате были улучшены существующие оценки для алгоритмов с уменьшением дисперсии без вычисления полного градиента. В случае невыпуклой целевой функции полученная оценка
    совпадает с классическими методами на основе перемешивания, а для сильно выпуклой задачи достигается улучшение. Проведён всесторонний теоретический анализ, а также представлены масштабные экспериментальные результаты, подтверждающие эффективность и практическую применимость предложенных методов в задачах обучения на больших данных.'
alina_samokhina__phd:
  kind: abstract
  source: https://github.com/Alina-Samokhina/continuous_time_paper
  text: 'In the signal decoding tasks, we work with multidimensional time series, which are a discretization of a continuous process. The latest works in neural ODE illustrate the possibility to work with recurrent neural networks as with differential equations. This work addresses such applications as change of sampling rate and handling missed or irregular data. It becomes possible if we represent our signal as a continuous in time function. This approach is relevant for signals from various wearable devices: accelerometers, heart rate monitors, devices for picking up brain signals such as electroencephalograms or electrocorticograms. The main result of this work is a comparison of convolutional and differential approaches to solving P300-paradigm signal decoding task while having regular and irregular time series.'
alkin_emil__master:
  kind: abstract
  source: https://raw.githubusercontent.com/AlkinEmil/MasterThesisPublic/main/Thesis.pdf
  text: Deep neural networks show their extreme efficiency in solving a wide range of practical problems. Despite this, a theoretical explanation of this phenomenon is only beginning to emerge in scientific research. For some special kinds of deep neural networks, it has been shown that depth is the key to efficiency. In particular, it has recently been shown that Tensor Train networks, i.e. recurrent neural networks, each layer of which implements a bilinear function, are exponentially more expressive than shallow networks. However, in practice, recurrent neural networks with identical layers are used, the analogue of which are Tensor Train networks with equal TT-cores. For this class of networks, the analogous result is not proved, but formulated as a Hypothesis. We prove this Hypothesis and thus close the question of exponential expressivity of traditional recurrent neural networks. We also conduct a series of numerical experiments to confirm the theoretical result.
alsahanova_nadezhda__master:
  kind: abstract
  source: https://raw.githubusercontent.com/NadezhdaAlsahanova/MSThesis/main/Doc/MS_Thesis_rus.pdf
  text: Интерфейсы мозг-компьютер (ИМК) - это быстро развивающаяся область исследований, которая помогает восстановливать двигательные способности. Современные данные ИМК содержат измерения с множе­ ствасигналов.Этисигналыизбыточныисильнокоррелируюткакповре­ менной, так и по пространственной координатам. Это приводит к неста­ бильности моделей. Поэтому используются методы уменьшения размер­ ности. Многие методы уменьшения размерности не могут учитывать корре­ ляцииповременнойипопространственнойкоординатам.Чтобывыявить эти корреляции, перед уменьшением размерности используется тензори­ зация. Одним из наиболее распространенных методов тензоризации вре­ менных рядов является ганкелизация. Ганкелизация помогает выявлять внутренние временные и пространственные корреляции. Однако этот ме­ тод не был использован в задаче прогнозирования в области ИМК. В этой работе мы нашли оптимальные тензорные представления при­ знаков и целевой переменной в скрытом пространстве, объединив ганке­ лизацию и методы
    уменьшения размерности. Мы протестировали ганке­ лизацию по времени, пространству и обоим измерениям. Кроме того, мы использовали несколько моделей уменьшения размерности, чтобы прове­ рить, дает ли ганкелизация улучшение качества для всех моделей. Этими моделямиявляютсямноголинейныйанализглавныхкомпонент(MPCA), метод частичных наименьших квадратов высокого порядка (HOPLS) и гибридный автоэнкодер. Результаты по трем наборам данных ИМК показали, что ганкелиза­ ция по пространственному измерению в наибольшей степени улучшает качество прогнозирования и упрощает тензор в скрытом пространстве для большинства случаев. Кроме того, в некоторых случаях наилучшим образом работает ганкелизация по обоим измерениям. Эти результаты показывают, что ганкелизация может улучшить качество прогнозирова­ ния в области ИМК.
altay_eynullayev__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Eynullayev-BS-Thesis/master/paper/paper.pdf
  text: Матрицы ковариации многомерных временных рядов лежат в римановом пространстве SPD матриц. Свойства этого пространства используются для решения задач классификации многомерных временных рядов. Проблема использования этого же подхода для прогнозирования многомерных временных рядов заключается в том, что, в отличие от задач классификации, нет возможности решать задачу в пространстве SPD матриц. Предлагаются прогностические модели, использующие риманову геометрию SPD матриц, и исследуется качество их прогноза в зависимости от свойств прогнозируемых временных рядов. Основные свойства, препятствующие повышению качества прогноза, являются потеря информации о фазе сигнала при вычислении матриц ковариации и отсутствие явной зависимости будущих значений временных рядов от ковариаций. Предлагается метод обнаружения и оценки эффекта потери фазовой информации, основанный на методе перекрестного сходящегося отображения. На синтетическом наборе временных рядов с особыми свойствами достигается повышение
    качества прогноза, иллюстрируя важность выдвинутых предположений.
altay_eynullayev__master: null
anastasia_german__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/AnastasiaGerman01/2025-Project-172/main/paper/дипплом%20итоговый.pdf
  text: 'Рассматривается мультимодальное обобщение линейной задачи прогнозирования фМРТ , в которой последовательность воксельных снимков восстанавливается одновременно по видео иа у д и о п о т о к ун а т у р а л и с т и ч н о г оа у д и о в и з у а л ь н о г ос т и м у л а. Подход развивается в три этапа возрастающей методологической сложности . Отправной точкой служит одномодальная базо вая модель, предсказывающая BOLD-сигнал по мел-частотным кепстральным коэффициентам (MFCC) звуковой дорожки. Затем вводится мультимодальная модель на основе гребневой регрессии с раздельными поблочными штрафами (banded ridge), которая объединяет аудио эмбеддинг со сжатым по размерности методом главных компонент (PCA) видеоэмбеддингом и назначает каждой модальности отдельный коэффициент регуляризации , такой анализ выявляет пространственную неоднородность вкладов аудио и видео в BOLD-сигнал. Однако, наивная конкатенация переоценивает более высокоразмерный поток и смешивает относитель ные вклады двух модальностей
    , ас а м ам о д е л ьо г р а н и ч е н аа р х и т е к т у р н о йа с и м м е т р и е йм е ж д у низкоразмерным аудиопредставлением, сконструированным вручную, и высокоразмерным предобученным видеопредставлением . Чтобы устранить эту асимметрию , MFCC- кодировщик заменяется самообучаемым речевым трансформером той же размерности , что и видеокодиров щик, ип р е д л а г а е т с яп о в о к с е л ь н а яgated-модель: на каждой модальности независимо обучается гребневая регрессия , а два предсказания комбинируются через повоксельный скалярный гейт ↵ijk 2 [0,1]. Оптимальный гейт выводится аналитически в замкнутой форме как наклон одномерной регрессии методом наименьших квадратов , усечённый на единичный отрезок [0,1]. Полученная модель проверяется на публичном датасете натуралистичной стимуляции ЭЭГ–фМРТ, где gated-модель устойчиво превосходит обе одномодальные базовые'
anastasia_linich__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/khilling/diploma/main/%D0%92%D0%9A%D0%A0.pdf
  text: В работе рассматривается задача бинарной классификации частичных доказательств в формальном языке Lean 4. Для этого был подготовлен датасет с частичными доказательствами на языке Lean4, а также предложено два интерпретируемых метода, основанных на анализе матриц внимания большой языковой модели (БЯМ) DeepSeek-Prover-v2-7b. Построенные классификаторы достигли большей точности предсказания, чем бейзлайны. Один из методов показал улучшение в точности предсказания на более, чем 3% относительно собственной оценки БЯМ в режиме запроса без обучения. 3 Глава
anastasia_voznyuk__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Voznyuk-BS-Thesis/master/paper/thesis/Voznyuk_BS_Thesis.pdf
  text: В настоящей работе рассматривается задача детекции фрагментов машинносгенерированного в документе, которая стала актуальной с возросшей популярностью больших языковых моделей и их повсеместным использованием при написании различных текстов. Данная задача является совокупностью двух различных задач, а именно выделение фрагментов различного авторства на основе смены стилистики текста, и их последующая классификация. В работе предлагаются методы решения трех подзадач - классификации автора всего документа, детекции смены авторов по фиксированным и известным позициям, а также задача детекции смены стиля на произвольной позиции. Все методы используют модель трансформера с дообучением для каждой подзадачи, кроме того для решения второй подзадачи дополнительно используется слой с марковской линейной цепочкой для учета контекста между фрагментами. Дополнительно предлагается учитывать контекст в документе с помощью скользящего окна в случае, когда необходимо разбить документ на фрагменты.
anastasia_voznyuk__master:
  kind: abstract
  source: https://arxiv.org/pdf/2503.03601
  text: Artificial Text Detection (ATD) is becoming increasingly important with the rise of advanced Large Language Models (LLMs). Despite numerous efforts, no single algorithm performs consistently well across different types of unseen text or guarantees effective generalization to new LLMs. Interpretability plays a crucial role in achieving this goal. In this study, we enhance ATD interpretability by using Sparse Autoencoders (SAE) to extract features from Gemma-2-2b’s residual stream. We identify both interpretable and efficient features, analyzing their semantics and relevance through domain- and model-specific statistics, a steering approach, and manual or LLM-based interpretation. Our methods offer valuable insights into how texts from various models differ from human-written content. We show that modern LLMs have a distinct writing style, especially in information-dense domains, even though they can produce human-like outputs with personalized prompts.
andrey_filatov__master:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Filatov-MS-Thesis/master/paper/FilatovMScThesis.pdf
  text: In recent years, large language models (LLMs) have made significant progress in natural language processing. It has been observed that these models may exhibit reasoning abilities when are sufficiently large. One piece of evidence supporting this claim is the ability of LLMs to solve a wide variety of tasks, including making summaries, answering questions, sentiment classification, and more. This ability of LLMs has been further explored in prompt engineering, where an LLM can learn to solve new tasks in a zero- or few-shot format by directly typing a question and receiving the answer in text form. In this work, we introduce text interfaces for event sequence data. Text interfaces are interfaces that enable interaction between a user and a model using textual input and output. Through text interfaces, we were able to extract information from sequence data and use this data to solve different tasks. One benefit of this approach is that it is possible to solve multiple tasks simultaneously.
    The results produced by the text interface model are compatible with the best classical learning format models, demonstrating its efficiency.
andrey_grabovoy__phd:
  kind: abstract
  source: https://github.com/andriygav/PhDThesis
  text: Работа посвящена выбору моделей глубокого обучения. Рассматриваются методы снижения пространства параметров моделей на основе дистилляции. Предлагается обобщение классической дистилляции используя выравнивания вероятностных пространств параметров модели учителя и ученика. Для снижения размерности пространства параметров используется информация об их априорном и апостериорном распределениях. Разобраны частные случае, когда учитель и ученика являются полносвязными и рекурентными нейросетевыми моделями.
andrey_veprikov__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Veprikov-BS-Thesis/master/paper/Диплом_Веприков.pdf
  text: Широкое внедрение систем машинного обучения в масштабах общества требует глубокого понимания долгосрочных последствий, которые эти системы оказывают на окружающую среду, включая потерю доверия, усиление ошибок и нарушение требований безопасности искусственного интеллекта. В данной работе вводится процесс многократного обучения для совместного описания нескольких явлений, таких как петли обратной связи (feedback loop), усиление ошибок (error amplification), дрейф понятий (concept drift), эхо-камеры (echo chambers) и другие. Этот процесс включает в себя весь цикл получения данных, обучения прогностической модели и предоставления прогнозов конечным пользователям в рамках единой математической модели. Отличительной особенностью многократного обучения является то, что состояние среды с течением времени становится зависимым от результатов работы модели, что нарушает обычные предположения о распределении данных. В данной работе вводится модель динамических систем процесса многократного
    обучения и находится предельное множество функций плотности вероятностей данных для режимов работы системы с положительной и отрицательной петлей обратной связи. Также проводится серия вычислительных экспериментов для задачи обучения с учителем на двух синтетических наборах данных. Экспериментальные данные соответствуют теоретическим предсказаниям, полученным на основе динамической модели. Результаты данной работы демонстрируют применимость предложенного подхода к изучению процессов многократного обучения в системах искусственного интеллекта и открывают широкие возможности для дальнейших исследований в этой области.
andrey_veprikov__master:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Veprikov-MS-Thesis/main/paper/main_veprikov.pdf
  text: В данной работе рассматривается задача оптимального управления в системе машинного обучения (МО) со скрытой петлей обратной связи. Под обратной связью понимается ситуация, когда предсказания модели на предыдущих шагах меняют обучающую выборку на текущем шаге. В работах автора [1, 2] такие системы изучались как дискретные динамические системы, найдены условия существования и сходимости их предельного множества. В настоящей работе в систему вводится управление𝑢𝑡, действующее на алгоритм обучения, а задача формулируется как максимизация суммарной награды при условии, что петля обратной связи не разрушается и система не вырождается. Постановка строится как расширение PoMDP. Оператор эволюции делится на две части, отвечающие за обучение модели и за реакцию среды, а допустимость управления задается определенным условием. Эта постановка применяется к двум сюжетам. В первом сюжете рассматривается задача прогнозирования цен на жилье, в которой наблюдается деградация системы. Во втором сюжете
    рассматривается метод Generative Replay в задаче непрерывного обучения. Для каждого сюжета конкретизируются оператор обучения, условие существования петли и функция награды. Получены следующие теоретические результаты. Доказаны достаточные условия допустимости управления через липшицевость функции потерь и через устойчивость алгоритма обучения к замене одного примера в обучающей выборке. Получена верхняя оценка средней ошибки модели на всех изученных задачах для произвольного расписания управления. Решена обратная задача восстановления управления по заданным целевым весам задач в финальной модели. В квадратичном приближении функции потерь выведены замкнутые формулы шага Generative Replay и спектральная оценка финальной ошибки. Отдельно получено разложение средней ошибки на компоненты смещения и дисперсии в случае одинаковых гессианов задач и независимых оптимумов. Условия сходимости в среднем квадратичном оказываются эквивалентны классическим условиям Роббинса-Монро на расписание. Все
    теоретические утверждения проверяются экспериментально. На синтетических задачах подтверждаются предсказания спектральной теории.
anna_remizova__bachelor: null
anton_bishuk__master:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Bishuk-MS-Thesis/main/paper/Bishuk-MS-thesis-defense.pdf
  text: Данная работа описывает новый метод генерации графов, который использует разделение статистических характеристик графа на две группы. Первая группа, называемая «простыми признаками», может быть вычислена эффективными детерминированными алгоритмами со сложностью не более квадратичной от числа вершин. Вторая группа характеристик генерируется в скрытом пространстве и отвечает за закономерности графа, которые невозможно описать «простыми признаками». Этот подход позволяет генерировать графы с точно заданными статистическими характеристиками, при этом сохраняя их разнообразие. Более того, данный метод может быть применен для генерации графов, имеющих схожую структуру с исходным. Это особенно полезно при работе с графами, описывающими контакты между людьми, например, граф контактов. – 4 –
anton_pilkevich__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/Intelligent-Systems-Phystech/Pilkevich-BS-Thesis/master/docs/main.pdf
  text: Один из способов оценки качества в задачах генерации текста — использование предобученной (например, на задачу классификации) глубокой нейросетевой модели. Например, модель, решающая задачу определениятоксичноститекста,можетиспользоватьсядляоценкикачества задачи детоксификации текста. Логично предположить, что оценивающую модель следует использовать для задания функции потерь, чтобы улучшить качество решения. Нейросетевые модели для обработки текста работают с ограниченным словарём входных токенов, и у разных моделей словарь может отличаться. В силу отсутствия инъективного отображения между токенами моделей, наивный способ использования оценивающей модели поверх результатов основной невозможен. Данная работа предлагает способ решения отсутствия дифференцируемости такой функции потерь на примере задачи детоксификации текстов. Предлагается обучить новый входной эмбеддинг-слой оценочной модели, называемый адаптером, который будет принимать распределения вероятностей токенов, выданных
    моделью детоксификатором. В работе предложен способ обучения адаптера с использованием в качестве функции потерь дивергенции Кульбака-Лейблера между истинной вероятностью токсичности и вероятностью, полученной при использовании адаптера. Также предложен способ одновременного обучения детоксификатора и адаптера, приводящие к улучшению качества модели. Проведенные эксперименты показывают эффективность предложенного метода
