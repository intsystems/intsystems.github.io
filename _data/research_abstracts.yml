alexander_terentyev__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/Terentev-BS-Thesis/master/paper/TerentyevBSThesis.pdf
  text: В работе рассмотрена задача классификации многомерных тра екторий физических систем. Классические методы для классификации тр аекторий как многомерных временных рядов используют предположения о ст атистических свойствах траекторий, но не используют априорную информац ию, что временные ряды являются траекториями динамических систем, по дчиняющихся физическим законам и неустойчивы к нефизическим изменения м траекторий. Для учета таких изменений требуется дополнительно обучать модели на аугментированной выборке. Целью работы является предложить м етод для классификации многомерных временных рядов, использующие инфо рмацию об их физической природе. Для этого предлагается классифициров ать не сами траектории, а динамические системы, заданные лагранжианами, соответствующие этим траекториям. Лагранжиан восстанавливается с помо щью физическиинформированных лагранжевых нейронных сетей. Предложена норма, которая вводится на пространстве лагранжианов. Она используется к ак метрика для метрических
    методов классификации. В основном для многоме рных классификаций используется сверточные нейронные сети, в предполож ении, что существуют статистические связи, между ближайшими точками вре менного ряда. Данные методы хорошо себя показывают во многих задачах, где эти связи являются преобладающими. Но для физических систем такие мето ды не подходят, и предлагается использовать знания о физических связях сис тем, для выбранных Лагранжевых нейронных сетей этим знанием является зако н сохранения энергии.
alexander_terentyev__master:
  kind: abstract
  source: https://raw.githubusercontent.com/lopate/inverse-npde/main/paper/thesis/main.pdf
  text: Решение уравнения частных производных находит применение в задачах математической физики. В работе рассматривается их применение для решении задачи ЭЭГ. В задаче ЭЭГ трудность вызывает получение точного сигнала от головного мозга. Исследователи встречаются со следующими проблемами. Высокая чувствительность прибора к движениям и тремору, обусловленному психоэмоциональным напряжением пациента, вызывает помехи в работе, что может затруднить диагностику. А если встраивать датчики напрямую в кору мозга, то они уже сами начинают влиять на его работу, а через некоторое время приходят в негодность из-за перестройки мозга вокруг них. Поэтому стоит задача точного определения восстановления местоположения источников сигнала, при условии высокого уровня шума для работы с этими источниками в медицинских целях. Целью работы является предложить метод решения обратной задачи в частных производных. Предлагается использовать физико-информированный подход в восстановлении источников, использующийся
    в задачах восстановления временных рядов, вносящий априорные знания о модели для уменьшения уровня шума от данных.
alexander_tolmachev__master:
  kind: abstract
  source: https://raw.githubusercontent.com/Alexandr-Tolmachev/Master-Thesis-public/main/Thesis.pdf
  text: 'TheInformationBottleneck(IB)principleoffersaninformation-theoreticframeworkforanalyzing thetrainingprocessofdeepneuralnetworks(DNNs). Itsessenceliesintrackingthedynamicsof two mutual information (MI) values: between the hidden layer output and the DNN input/target. AccordingtothehypothesisputforthbyShwartz-Ziv,Tishby(2017),thetrainingprocessconsists oftwodistinctphases: fittingandcompression. Thelatterphaseisbelievedtoaccountforthegood generalization performance exhibited by DNNs. Due to the challenging nature of estimating MI between high-dimensional random vectors, this hypothesis was only partially verified for NNs of tinysizesorspecifictypes,suchasquantizedNNs. Inthiswork,weintroduceaframeworkforconducting IB analysis of general NNs. Our approach leverages the stochastic NN method proposed byGoldfeldet. al.(2019)andincorporatesacompressionsteptoovercometheobstaclesassociated withhighdimensionality. Inotherwords,weestimatetheMIbetweenthecompressedrepresentationsofhigh-dimensionalrandomvectors.
    Theproposedmethodis supportedbyboththeoretical and practical justifications. Notably, we demonstrate the accuracy of our estimator through synthetic experiments featuring predefined MI values and comparison with MINE (Belghazi et. al., 2018). Finally,weperformIBanalysisonaclose-to-real-scaleconvolutionalDNN,whichreveals newfeaturesoftheMIdynamics.'
alexander_udeneev__bachelor:
  kind: abstract
  source: https://raw.githubusercontent.com/intsystems/predicator-function-for-neural-networks/master/paper/Udeneev2025Surrogate.pdf
  text: Ансамбли нейронных сетей являются стандартным способом повышения качества, устойчивости и надёжности глубоких моделей, однако их эффективность существенно зависит как от качества отдельных моделей, так и от разнообразия между ними. Большинство методов поиска архитектур нейронных сетей (Neural Architecture Search, NAS) требуют значительных вычислительных ресурсов. Их расширение до задачи поиска ансамблей нейронных сетей (Neural Ensemble Search, NES), предполагающей совместную оптимизацию архитектур отдельных моделей и состава ансамбля, приводит к экспоненциальному росту пространства поиска и делает задачу вычислительно трудноразрешимой. Для решения этой проблемы мы предлагаем метод поиска ансамблей, основанный на суррогатных моделях. Архитектуры моделей представляются в виде ориентированных ациклических графов, а две независимые суррогатные модели обучаются для оценки качества предсказаний и разнообразия архитектур посредством их отображения в латентное пространство. Совместное использование
    этих оценок позволяет эффективно находить архитектуры, которые одновременно обладают высокой индивидуальной точностью и способствуют формированию разнообразного ансамбля. Проведённые эксперименты показывают, что построенный ансамбль достигает результатов, сопоставимых или превосходящих стандартные базовые методы, включая Deep Ensembles и Random Search, на наборах данных FashionMNIST, CIFAR-10 и CIFAR-100. 2 Content Annotation . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 1 Стр.
