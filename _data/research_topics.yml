# Research map: directions, topics and per-work tags (hand-edited).
# scripts/build_research_map.py reads this file and writes _data/research_map.yml.
# Topics were derived from Ward clustering of the work embeddings (5 directions -> 12 topics) and checked against the abstracts.
# Work id = student name tokens (transliterated), sorted, + degree level; the first tag is the primary topic.
# A topic may carry open_problems: {en: ..., ru: ...}, shown when the topic is selected.

directions:
  signals:
    en: "Signals & dynamical systems"
    ru: "Сигналы и динамические системы"
  deep_learning:
