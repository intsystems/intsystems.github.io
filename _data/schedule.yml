# Department schedule — single source for /education/ in BOTH languages.
# Rendered by _includes/schedule.html; the current and upcoming semesters are
# shown expanded, past ones are collapsed automatically (by `start`/`end`).
#
# Semester fields:
#   id        spring_YYYY | fall_YYYY (also the heading anchor)
#   season    spring | fall            (label comes from schedule.seasons.* in en.yml/ru.yml)
#   start/end the semester is "current" between these dates; make `end` the day
#             before the next semester starts so there is always a current one
#   draft     true → "(preliminary)" note under the heading
#   key_dates list of {date, [date_end], en, ru, [tag]}; text is markdown,
#             write internal links as ({baseurl}/materials/...). `tag: admission`
#             dates also appear on /admission/ while they are upcoming.
#   groups    one table per year of study: {year_of_study, semester, day, courses}
#             courses: {time, course_id, [type: lecture|seminar]}; course_id is a
#             filename from _course/ or the pseudo id research_work.

semesters:
  - id: fall_2026
    season: fall
    year: 2026
    start: 2026-09-07
    end: 2027-02-09
    draft: false
    key_dates:
