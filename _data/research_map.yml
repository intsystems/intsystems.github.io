  title: Флоу матчинг в задачах трансляции КТ
  abstract: "В работе исследуется задача порождающего моделирования условного распределения медицинских изображений: построение измеримого отображения T : Rd →R d, переводящего распределение нативных компьютерных томограмм πN в распределение их контрастных аналоговπC (и обратно). Формально требуется решить транспортную задачуT#π0 = π1 в d = 5122-мерном пространстве при наличии парных наблюдений(xN ,xC)∼γ,γ∈Π(π N ,πC). Предлагается методMedical Flow Matching (MFM)— условный флоу матчинг с линейным интерполянтомxt = (1 −t )x0 + tx1. Минимизируется симуляционно-свободный функционал LCFM(θ) =E t∼U[0,1],(x 0,x1)∼γ \x02 ∥fθ(xt,t)−(x 1 −x 0)∥22\x03, аппроксимирующий маргинальное поле скоростейut, порождающее перенос. Реализацией fθ служит архитектураTimeResNet— U-Net с поблочной аффинной модуляцией синусоидального временного эмбеддинга и свёрточным модулем self-attention на боттлнеке. В отличие от диффузионных моделей, требующих T∼ 102–103 шагов денойзинга, при линейном интерполянте кинетическая\
    \ энергия потока минимальна, кривизна траектории нулевая, и интегрирование ОДУ методом Эйлера за один шаг точно с точностью до аппроксимационной ошибки сети. На отложенной выборке из 20 пациентов (9372 среза) MFM достигает MAE=4.25HU, SSIM=0.994 и PSNR=42.19дБ при времени инференса 0.125с на срез, сокращая время в354 разапо сравнению с DDPM и в7.1 раза снижая MAE по сравнению со SMILE [1]. Из симметрии линейного интерполянта следует двунаправленность: единственная сетьfθ реализует трансляцию в обе стороны без увеличения числа параметров. Прикладная значимость подтверждается тем, что nnUNetv2, обученный на синтезированных MFM нативных срезах, достигает Dice=0.926 (95.9% от уровня 0.966 на реальных данных) в задаче сегментации аорты."
