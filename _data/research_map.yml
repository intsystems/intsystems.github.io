  title: Implicit weak adversarial networks to solve stochastic partial differential equations
  abstract: We introduce Implicit Weak Adversarial Networks (IWANs), a novel framework for solving high-dimensional partial differential equations (PDEs) that combines the weak adversarial network (WAN) formulation with implicit neural representations (INRs). Traditional WANs employ deep neural networks to approximate both the solution and test functions in a minimax formulation of the weak PDE problem. IWANs replace the primal network with a sinusoidal activation network (SIREN), which provides analytically computable derivatives and superior smoothness properties. This architectural innovation leads to faster convergence, improved accuracy, and better gradient flow during training. We demonstrate the effectiveness of IWANs on elliptic and parabolic PDEs in dimensions up to 100, showing significant improvements over standard W ANs. Furthermore, we explore connections to diffusion models and discuss potential applications in generative modeling through PDE-based formulations.
