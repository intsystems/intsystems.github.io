  abstract: Low-rankadaptation(LoRA)hasbecomethedefactostandardforparameterefficient fine-tuning of large language models. Existing theoretical bounds on expressivity and generalization of LoRA are formulated in terms of algebraic rank, which fails to capture the empirical observation that trained matrices often exhibit stable rank significantly lower than their nominal rank. In this paper, we propose stable rank as a more appropriate theoretical measure for analyzing LoRA’s properties. We derive fundamental limits on single matrix approximation under stable rank constraint, extend these to expressivity bounds for fully connected networks and transformers. Additionally, we prove a tighter generalization bound proportional to p sr(∆W) rather than previous best p rank(∆W) from the literature, using a PAC-Bayesian framework. We manage to validate our theoretical findings and demonstrate via controlled experiments on synthetic data thatO( p sr(∆W) )is more practical estimate for generalization
