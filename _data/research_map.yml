  title: 'Optimal Flow Matching: новый подход к генеративному моделированию и оптимальному транспорту'
  abstract: В последние несколько лет в области генеративного моделирования активно развиваются Flow Matching (FM) методы. Одно из желаемых свойств этих методов, это возможность обучать потоки с прямыми траекториями, реализующими оптимальные транспортные (Optimal Transport, OT) перемещения. Прямолинейность траекторий критически важна для быстрого и качественного семплирования из моделей. Однако большинство существующих методов спрямления траекторий основаны на нетривиальных итеративных процедурах, которые накапливают ошибку в процессе обучения, или используют эвристики, опирающиеся на мини-батч OT. Чтобы исправить эти недостатки, я разработал и теоретически обосновал новый подход — Optimal Flow Matching (OFM), который позволяет восстановить решение оптимального транспорта для квадратичной функции потерь всего за один шаг FM минимизации. Основная идея этого подхода заключается в использовании прямых векторных полей, параметризованных выпуклыми функциями. Все теоретические свойства и практическая
    эффективность метода были подтверждены в большом количестве экспериментов на реальных прикладных задачах.
