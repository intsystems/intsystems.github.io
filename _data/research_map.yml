  title: 'Model Compression via Internal Regularization: A Comparative Study of Sparsity-Inducing Algorithms for Layer Pruning'
  abstract: 'Large Language Models (LLMs) have demonstrated remarkable capabilities in natural language understanding and generation. However, the internal representations that drive these capabilities remain poorly understood. This paper investigates the geometric structure of hidden representations in transformerbased LLMs, proposing a probabilistic framework to analyze layer-wise feature relevance. We introduce a Beta-mixture model to classify transformer layers as either useful or redundant for downstream tasks, and develop an Expectation-Maximization (EM) algorithm for parameter estimation. We compare four algorithms for feature selection and sparsity induction: Stochastic Gates (STG), Gumbel- STG, Adaptive Importance Gates (AIG), and standard L1 regularization. Drawing on insights from recent work on sample complexity in deep tabular models, we analyze how representation geometry evolves across layers and influences model performance. Our experimental results on CIFAR-10/100 with ResNet
    architectures demonstrate that strategic layer removal based on channel sparsity thresholds achieves significant model compression (up to 2.4×reduction in parameters) with minimal accuracy degradation (0.5-1.0% drop). We further propose a greedy algorithm that iteratively identifies and removes the least useful blocks while maintaining performance above a desired threshold.'
