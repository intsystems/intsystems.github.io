  title: Алгоритм распознования скрытых петель обратной связи в рекомендательных системах
  abstract: 'Алгоритм распознавания скрытых петель обратной связи в рекомендательных системах Дементьев Сергей Андреевич Рекомендательные системы периодически переобучаются на логах собственных взаимодействий, образуя замкнутый контур обратной связи, в котором наблюдаемые отклики перестают быть нейтральным измерением предпочтений. В работе построена математическая модель такого контура и установлено, что деградация персонализации складывается из двух различных каналов. Доказана теорема о стягивании разнообразия: внутрикластерный разброс предпочтений убывает геометрически под действием дрейфа вкусов по концентрированной выдаче, причём это убывание универсально и наступает даже без переобучения. Доказана теорема о переформировании выдачи: переобучение сужает ковариацию показанного контента сильнее, чем замороженная модель, оставляя отделимый след, измеримый в дисперсионной части расхождения распределений предпочтений. Получены условия активации этого следа и проверяемый порог концентрации.
    Теоретические выводы подтверждены серией вычислительных экспериментов на синтетических данных и наборе MovieLens-20M. Предложен практический критерий риска коллапса персонализации и показано, что явная диверсификация выдачи сохраняет разнообразие без потери качества. Результаты применимы для мониторинга и подавления нежелательных петель обратной связи в промышленных рекомендательных системах. Abstract Recommendersystemsareperiodicallyretrainedonthelogsoftheirowninteractions, forming a closed feedback loop in which observed responses are no longer a neutral measurement of user preferences. This work develops a mathematical model of the loop and shows that the degradation of personalization splits into two distinct channels. A contractiontheoremisproved:thewithin-clusterspreadofpreferencesdecaysgeometrically duetopreferencedrifttowardsaconcentratedfeed,andthisdecayisuniversal,occurring evenwithoutretraining.Areshapingtheoremisproved:retrainingnarrowsthecovariance oftheservedcontentmorethanafrozenmodeldoes,leavingaseparabletracemeasurable
    in the dispersion part of the divergence between preference distributions. Activation conditionsandaverifiableconcentrationthresholdareobtained.Thetheoryisconfirmed by a series of computational experiments on synthetic data and the MovieLens-20M dataset. A practical risk criterion is proposed, and explicit feed diversification is shown to preserve diversity without loss of quality. 2 Алгоритм распознавания скрытых петель обратной связи в рекомендательных системах'
