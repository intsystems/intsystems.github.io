  abstract: В работе рассматривается задача бинарной классификации частичных доказательств в формальном языке Lean 4. Для этого был подготовлен датасет с частичными доказательствами на языке Lean4, а также предложено два интерпретируемых метода, основанных на анализе матриц внимания большой языковой модели (БЯМ) DeepSeek-Prover-v2-7b. Построенные классификаторы достигли большей точности предсказания, чем бейзлайны. Один из методов показал улучшение в точности предсказания на более, чем 3% относительно собственной оценки БЯМ в режиме запроса без обучения. 3 Глава
