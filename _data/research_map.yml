  title: Understanding the Plasticity of Neural Networks Employed in GFlowNets
  abstract: Generative Flow Networks (GFlowNets) are a family of generative models that learn to sample objects with probabilities proportional to a given reward function. Recent results show a close relationship between GFlowNet training and entropyregularized reinforcement learning (RL) problems with a particular reward design. Inspired by this we also identify the dormant neuron phenomenon in GFlowNets , where a model’s network suffers from an increasing number of inactive neurons, thereby affecting network expressivity. To address this issue, we use a simple and effective method (ReDo) that Recycles Dormant neurons throughout training. Our experiments demonstrate that this method maintains the expressive power of networks in GFlowNets by reducing the number of dormant neurons and results in improved performance.
