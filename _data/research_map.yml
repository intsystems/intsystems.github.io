  title: Анализ взаимосвязи между ЭЭГ и фМРТ с помощью CCA и CCM
  abstract: 'В данной работе анализируются фазовые траектории сигналов ЭЭГ и фМРТ , спроецированные в латентное пространство, которое порождается контрастивно обученной моделью совместного представления этих двух модальностей. Ключевая цель исследования - изучить взаимосвязь между временными рядами фМРТ и ЭЭГ . Для её достижения были определены следующие шаги: формализовать аддитивную порождающую модель данных; обучить модель, способную отображать обе модальности в единое скрытое пространство; использовать статистические критерии для подтверждения работы модели; применить CCA и CCM для исследования взаимосвязи фазовых траекторий ЭЭГ и фМРТ , получаемых с помощью полученной модели. В итоге разработана модель, построенная на адаптации предварительно обученных энкодеров и реализующая предложенную аддитивную модель данных. С использованием методов CCA и CCM зафиксирована значимая взаимная корреляция, что подтверждает кодирование общего стимула как в ЭЭГ , так и в фМРТ . Рекомендуется формировать
    положительные пары из данных разных испытуемых для обеспечения инвариантности к субъекту , а также использовать обучаемые сдвиги для субъектов с регуляризацией, для избежания неявного запоминания индивидуальных особенностей испытуемого при минимизации функции потерь, что позволяет предотвратить переобучение и ухудшение результатов на тестовой выборке.'
