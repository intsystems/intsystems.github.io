  title: Generative Models from Physical Processes
  abstract: Физические концепции часто вдохновляют на создание новых алгоритмов машинного обучения. В частности, в генеративном моделировании в настоящее время именно такие модели являются state-of-the-art результатами. В данной работе недавно опубликованные работы генеративных моделей на основе электростатики расширяются на другую физическую концепцию - взаимодействие Юкавы. Особенности потенциала Юкавы позволяют давать лучшее качество алгоритмов генеративного моделирования и задач переноса домена.
