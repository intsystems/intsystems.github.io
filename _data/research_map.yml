  title: Jacobian Analysis of a Recurrent Transformer Block
  abstract: Recurrent Transformers are a parameter-efficient approach for modeling deep computations, but their deployment in iterative settings requires controlled and stable dynamics. We study the Jacobian dynamics of a full Transformer block with Multi-Head Self-Attention (MSA), Feed-Forward Networks (FFN), and RMS normalization. We derive an explicit upper bound on the spectral norm of the full-step Jacobian, showing that RMSNorm acts as a multiplicative damping factor that prevents gradient explosion. Under mild assumptions, the Jacobian norm remains O(1) in the large-step regime. Our theoretical results, validated on synthetic and CIFAR-10 data, provide insight into stability properties of recurrent models.
