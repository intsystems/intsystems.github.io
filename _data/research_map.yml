  title: 'Extending Equilibrium Matching: Second-Order Dynamics, Latent Spaces, and Conditional Generation'
  abstract: Equilibrium Matching (EqM) has recently emerged as a promising generative framework that learns time-invariant equilibrium dynamics, contrasting with the non-equilibrium dynamics of traditional diffusion and flow-based models. By discarding time-conditioning in favor of an implicit energy landscape, EqM allows for flexible optimization-based sampling. In this work, we analyze the properties of EqM and propose several critical extensions. First, we investigate the stability of the training objective by introducing a Second-Order regularization term based on Hutchinson's estimator to align the Hessian of the energy landscape. Second, we extend EqM to Latent Spaces (LEqM) using VAEs to scale generation capabilities. Third, we implement Conditional Generation using Adaptive Group Normalization (AdaGN). Finally, we provide a detailed analysis of sampling dynamics using UMAP visualizations and explore alternative noise scheduling strategies (Beta distribution) to address training instabilities.
    Our experiments on MNIST and CIFAR-10 demonstrate that while standard EqM is robust, second-order constraints and smooth gradient scaling functions ($c(\gamma)$) can significantly influence convergence and generation quality.
