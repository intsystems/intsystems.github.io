  title: Причинно-ориентированное снижение размерности для анализа данных нейроинтерфейсов
  abstract: Изучение низкоразмерных представлений, сохраняющих причинно–следственную структуру, является ключевым шагом на пути к интерпретируемому моделированию многомерных динамических данных. В тезисе представлен линейный автокодировщикCaSCA, который разбивает скрытое пространство на каузальный блок, фиксирующий отложенное направленное влияние от одного многомерного ряда к другому, и реконструктивный блок, сохраняющий остаточную дисперсию. Расширения для траекторных эмбеддингов, римановых ковариационных пространств и нейросетевого варианта с дифференцируемым методом сходящегося перекрёстного отображения расширяют фреймворк. Вычислительный эксперимент на двух реальных наборах данных – записях с использованием двух акселерометров и гироскопа и ЭЭГ—ИИМ, полученных во время игры в настольный теннис, – показывают, что CaSCA (i) уменьшает мультиколлинеарность, (ii) восстанавливает сигналы с незначительной потерей объясняемой дисперсии и (iii) улучшает последующее прогнозирование. Таким образом,
    метод предлагает компактное, поддающееся интерпретации пространство состояний, в котором причинно-следственные связи легче обнаруживать и использовать.
