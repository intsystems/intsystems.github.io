  title: Surrogate assisted diversity estimation in neural ensemble search
  abstract: Ансамбли нейронных сетей являются стандартным способом повышения качества, устойчивости и надёжности глубоких моделей, однако их эффективность существенно зависит как от качества отдельных моделей, так и от разнообразия между ними. Большинство методов поиска архитектур нейронных сетей (Neural Architecture Search, NAS) требуют значительных вычислительных ресурсов. Их расширение до задачи поиска ансамблей нейронных сетей (Neural Ensemble Search, NES), предполагающей совместную оптимизацию архитектур отдельных моделей и состава ансамбля, приводит к экспоненциальному росту пространства поиска и делает задачу вычислительно трудноразрешимой. Для решения этой проблемы мы предлагаем метод поиска ансамблей, основанный на суррогатных моделях. Архитектуры моделей представляются в виде ориентированных ациклических графов, а две независимые суррогатные модели обучаются для оценки качества предсказаний и разнообразия архитектур посредством их отображения в латентное пространство. Совместное
    использование этих оценок позволяет эффективно находить архитектуры, которые одновременно обладают высокой индивидуальной точностью и способствуют формированию разнообразного ансамбля. Проведённые эксперименты показывают, что построенный ансамбль достигает результатов, сопоставимых или превосходящих стандартные базовые методы, включая Deep Ensembles и Random Search, на наборах данных FashionMNIST, CIFAR-10 и CIFAR-100. 2 Content Annotation . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 1 Стр.
