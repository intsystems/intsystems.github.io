  title: Information Bottleneck Analysis of Deep Neural Networks
  abstract: 'TheInformationBottleneck(IB)principleoffersaninformation-theoreticframeworkforanalyzing thetrainingprocessofdeepneuralnetworks(DNNs). Itsessenceliesintrackingthedynamicsof two mutual information (MI) values: between the hidden layer output and the DNN input/target. AccordingtothehypothesisputforthbyShwartz-Ziv,Tishby(2017),thetrainingprocessconsists oftwodistinctphases: fittingandcompression. Thelatterphaseisbelievedtoaccountforthegood generalization performance exhibited by DNNs. Due to the challenging nature of estimating MI between high-dimensional random vectors, this hypothesis was only partially verified for NNs of tinysizesorspecifictypes,suchasquantizedNNs. Inthiswork,weintroduceaframeworkforconducting IB analysis of general NNs. Our approach leverages the stochastic NN method proposed byGoldfeldet. al.(2019)andincorporatesacompressionsteptoovercometheobstaclesassociated withhighdimensionality. Inotherwords,weestimatetheMIbetweenthecompressedrepresentationsofhigh-dimensionalrandomvectors.
    Theproposedmethodis supportedbyboththeoretical and practical justifications. Notably, we demonstrate the accuracy of our estimator through synthetic experiments featuring predefined MI values and comparison with MINE (Belghazi et. al., 2018). Finally,weperformIBanalysisonaclose-to-real-scaleconvolutionalDNN,whichreveals newfeaturesoftheMIdynamics.'
