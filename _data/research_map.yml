  abstract: В данной работе мы осуществляем исследование задачи прогнозирования одной временной траектории на основе другой. В рамках этого исследования, мы предлагаем подход, основанный на снижении размерности исходного и целевого пространства траекторий, что позволяет упростить процесс анализа и создания модели согласования для перехода между этими пространствами. Мы проводим обзор и анализ различных методов аппроксимации в контексте многомодельного моделирования, нацеленных на эффективное построение модели согласования. В качестве элемента предложенного решения, мы применяем подход к отбору признаков на основе квадратичного программирования и метод частичных наименьших квадратов для установления связей между траекториями. В рамках экспериментальной части исследования, проводится проверка устойчивости предложенных подходов на данных, полученных от носимых устройств. Результаты подтверждают устойчивость и эффективность предложенного метода в задаче прогнозирования траекторий, что указывает
    на его применимость и перспективность для работы со сложными временными рядами и их взаимосвязями.
