  title: Automatic Hierarchical Summarization of Scientific Texts
  abstract: Hierarchical summarization is a way of organizing information from key points to more specific details. This text summarization method offers a more personalized knowledge acquisition experience, allowing to delve into a topic to any desired extent and only get into more specific details where needed. This method, however, didn’t get much attention in scientific literature, possibly due to the lack of quality datasets and proper evaluation metrics. We offer a revision of hierarchical summarization in the era of large language models (LLMs), proposing a novel approach to the task utilizing LLMs and investigating how well such models perform on this task and similar ones. We also propose novel evaluation methods designed specifically for automatic hierarchical summarization evaluation. Furthermore, we provide a new dataset of hierarchical summaries of scientific papers, offering more quality data for the evaluation of hierarchical summarization methods.
