  title: Снижение размерности латентного пространства в задачах управления
  abstract: Работа посвящена снижению размерности латентного пространства в задачах прогнозирования распределённых динамических систем по данным сети датчиков. Цель— снижение размерности латентного пространства динамической системы и построение в редуцированном пространстве оператора связности, способного описывать направленные взаимодействия между датчиками. Задачи:показатьпринципиальноеограничениесимметричныхмоделейоператора связности; построить низкоразмерное представление состояния системы через вложение Такенса; предложить параметризацию оператора в редуцированном пространстве, не ограниченную симметрийным классом; экспериментально подтвердить результаты на синтетических и реальных данных. Результаты.На синтетической системе с заведомо асимметричным оператором модель снижает ошибку прогноза на 11,1% относительно симметричной базовой модели и восстанавливает направленность переноса. На данных ЭЭГ моторного воображения прирост составляет 6,8%. Рекомендации.Модель рекомендуется для задач
    прогнозирования в системах с направленной связностью (нейрофизиология, транспорт, климат) и может быть использована как предиктивная компонента в контурах управления. 2 Снижение размерности латентного пространства в задачах управления
