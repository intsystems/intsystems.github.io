  abstract: 'В данной работе представлена разработка бенчмарка ru-zh-SciBench для оценки качества мультиязычного retrieval научных текстов на русском, английском и китайском языках. Бенчмарк включает четыре типа задач: мультиклассовую и мультилейбл классификацию, ранжирование (reranking) и поиск перевода. Данные для бенчмарка собраны с сайта sciencechina.cn и включают 5K статей-запросов, 641K кандидатов для ранжирования и 16K статей для задач классификации. Для валидации бенчмарка проведено обучение базовых моделей на корпусе из 211 миллионов примеров, собранных из трёх источников: Elibrary (Ru-En), Semantic Scholar (En) и ScienceChina (Zh-En). Бенчмарк опубликован в open source на платформе Hugging Face и доступен для использования научным сообществом. Результаты оценки различных моделей на бенчмарке демонстрируют его применимость для сравнения качества retrieval-моделей на научных текстах.'
