  abstract: Данная работа описывает новый метод генерации графов, который использует разделение статистических характеристик графа на две группы. Первая группа, называемая «простыми признаками», может быть вычислена эффективными детерминированными алгоритмами со сложностью не более квадратичной от числа вершин. Вторая группа характеристик генерируется в скрытом пространстве и отвечает за закономерности графа, которые невозможно описать «простыми признаками». Этот подход позволяет генерировать графы с точно заданными статистическими характеристиками, при этом сохраняя их разнообразие. Более того, данный метод может быть применен для генерации графов, имеющих схожую структуру с исходным. Это особенно полезно при работе с графами, описывающими контакты между людьми, например, граф контактов. – 4 –
