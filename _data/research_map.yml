  title: Adversarial training approach for a neural network in Transfer Learning problem
  abstract: Inductive transfer learning aims at adapting a pre-trained neural network to target data without access to a source database. Most modern methods suﬀer from strong regularization between corresponding parameters. An eﬃcient inductive transfer learning method should take enough information from a pre-trained model, but also learn vital patterns from new data. We present the novel technique of transfer learning that is based on optimal transport theory. However, this method requires deep neural networks(DNN) that are strongly 1— Lipschitz continuity functions in according to the theory. To solve this issue, we develop such networks and prove necessary theoretical guarantees for them. We show, that the regularization of the proposed method computes ground-truth the Wasserstein-1 distance between distributions of parameters, while another penalization strategies compute an upper bound. We demonstrate the abilities of the proposed method and compare it with relevant transfer learning
    techniques.
