  abstract: В настоящей работе рассматривается задача детекции фрагментов машинносгенерированного в документе, которая стала актуальной с возросшей популярностью больших языковых моделей и их повсеместным использованием при написании различных текстов. Данная задача является совокупностью двух различных задач, а именно выделение фрагментов различного авторства на основе смены стилистики текста, и их последующая классификация. В работе предлагаются методы решения трех подзадач - классификации автора всего документа, детекции смены авторов по фиксированным и известным позициям, а также задача детекции смены стиля на произвольной позиции. Все методы используют модель трансформера с дообучением для каждой подзадачи, кроме того для решения второй подзадачи дополнительно используется слой с марковской линейной цепочкой для учета контекста между фрагментами. Дополнительно предлагается учитывать контекст в документе с помощью скользящего окна в случае, когда необходимо разбить документ на фрагменты.
