  title: Verification of artificially generated text fragments
  abstract: Transformer models achieve strong classification performance but often degrade under domain shifts or unseen data. Scaling models can mitigate this issue but is computationally expensive. Parameter-efficient adaptation methods, such as Low-Rank Adaptation (LoRA), provide a lightweight alternative. We establish a theoretical foundation for LoRA in transformers, proving that empirical risk minimization with LoRA converges to true risk minimization as sample size grows. We further analyze generalization in multi-task learning (MTL) using Rademacher complexity, showing that joint training acrossTrelated tasks reduces target-task complexity by approximately1/ √ T, compared to single-task learning (STL). To demonstrate practical benefits, we evaluate our approach on the task of machine-generated text detection. Our method improves robustness under domain shifts, achieving anF 1 score 5% higher than STL and a lower empirical Rademacher complexity. These results show that parameter-efficient
    and theoretically grounded adaptation can substantially improve model reliability and performance in cross-domain scenarios.
