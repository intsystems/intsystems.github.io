  abstract: 'Модели диффузионных мостов как в непрерывных, так и в дискретных пространствах состояний в последнее время стали мощным инструментом в области генеративного моделирования. В данной работе мы используем модели бридж-матчинга для решения важной задачи в машинном обучении и теории информации: оценки взаимной информации (MI) между дискретными случайными величинами. Формулируя задачу оценки MI как проблемупереноса домена, мы конструируем эстиматор взаимной информации на основе дискретных диффузионных мостов (DBMI, Discrete Bridge Mutual Information). DBMI подходит для работы с дискретными данными, что является сложной задачей для классических эстиматоров MI. Мы демонстрируем эффективность и качество нашего метода на двух бенчмарках оценки MI: низкоразмерном и высокоразмерном (основанном на изображениях).'
