  abstract: Во многих задачах оптимизации информация о градиенте целевой функциинедоступна,идоступкзначениямфункцииможнополучитьтолько через оракул по типу черного ящика. Такие условия требуют использования методов нулевого порядка. В данной работе изучается задача негладкой оптимизации на выпуклом компакте со стохастическим шумом с тяжелыми хвостами, т.е. шум с(1 +𝜅)-м ограниченным моментом, и с враждебным шумом в значениях функции. Мы предлагаем два новых алгоритма, оптимальных с точки зрения количества вызовов двухточечного оракула. Их оракульная сложность пропорциональна (︁√ 𝑑/𝜀 )︁ 1+𝜅 𝜅 с высокой вероятностью и по математическому ожиданию, где𝑑 – размерность пространства, а 𝜀 – точность по значению функции. Нашиалгоритмыпостроенынаэффективныхметодахпервогопорядка. Первый алгоритм основан на устойчивом к шуму с тяжелыми хвостами зеркальном спуске. Второй алгоритм основан на методе клиппирования градиента. В работе обсуждаются различия между этими двумя алгоритмами, а также рекомендации
    по настройке параметров. Кроме того, для целевых функций, удовлетворяющих условию острого минимума, предлагается более быстрый алгоритм с использованием техники рестартов. Особое внимание уделяется вопросу о том, насколько большим может быть враждебный шум, чтобы гарантировать оптимальность алгоритмов.
