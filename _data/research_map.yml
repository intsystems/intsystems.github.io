  title: Задача оптимального управления в системах искусственного интеллекта с обратной связью
  abstract: В данной работе рассматривается задача оптимального управления в системе машинного обучения (МО) со скрытой петлей обратной связи. Под обратной связью понимается ситуация, когда предсказания модели на предыдущих шагах меняют обучающую выборку на текущем шаге. В работах автора [1, 2] такие системы изучались как дискретные динамические системы, найдены условия существования и сходимости их предельного множества. В настоящей работе в систему вводится управление𝑢𝑡, действующее на алгоритм обучения, а задача формулируется как максимизация суммарной награды при условии, что петля обратной связи не разрушается и система не вырождается. Постановка строится как расширение PoMDP. Оператор эволюции делится на две части, отвечающие за обучение модели и за реакцию среды, а допустимость управления задается определенным условием. Эта постановка применяется к двум сюжетам. В первом сюжете рассматривается задача прогнозирования цен на жилье, в которой наблюдается деградация системы. Во втором
    сюжете рассматривается метод Generative Replay в задаче непрерывного обучения. Для каждого сюжета конкретизируются оператор обучения, условие существования петли и функция награды. Получены следующие теоретические результаты. Доказаны достаточные условия допустимости управления через липшицевость функции потерь и через устойчивость алгоритма обучения к замене одного примера в обучающей выборке. Получена верхняя оценка средней ошибки модели на всех изученных задачах для произвольного расписания управления. Решена обратная задача восстановления управления по заданным целевым весам задач в финальной модели. В квадратичном приближении функции потерь выведены замкнутые формулы шага Generative Replay и спектральная оценка финальной ошибки. Отдельно получено разложение средней ошибки на компоненты смещения и дисперсии в случае одинаковых гессианов задач и независимых оптимумов. Условия сходимости в среднем квадратичном оказываются эквивалентны классическим условиям Роббинса-Монро на расписание.
    Все теоретические утверждения проверяются экспериментально. На синтетических задачах подтверждаются предсказания спектральной теории.
