  title: Ландшафт функции Потерь для архитектуры Трансформер
  abstract: 'В данной выпускной квалификационной работе исследуется локальная геометрия функции потерь трансформерных архитектур на основе анализа матриц вторых производных. Несмотря на широкое применение трансформеров, точное описание их оптимизационного ландшафта остается неполным, поскольку полный блок включает несколько взаимодействующих нелинейных компонент: self-attention, residual-соединения, LayerNorm и feed-forward network. Цель работы состоит в выводе точной матрицы Гессе полного post-norm трансформерного блока и получении спектральных оценок ее блоков. В отличие от работ, рассматривающих только self-attention, в данной работе анализируется полный блок. Для произвольной дважды дифференцируемой функции потерь используется гаусс–ньютоновское разложение матрицы Гессе на внешний член и функциональный член, задаваемый кривизной самой архитектуры. В работе вводится строковая векторизация, выводятся матрицы Якоби и матрицы Гессе LayerNorm, матрицы Якоби FFN, включаются вторые производные
    self-attention и получается блочная формула матрицы Гессе полного трансформерного блока. Также доказывается оценка спектральной нормы полной матрицы Гессе и локальная оценка сходимости поверхности функции потерь при увеличении объема данных. ЧисленнаяпроверкапоказываетсовпадениеаналитическихформулсPyTorch autograd до численной точности и демонстрирует блочную неоднородность матрицы Гессе трансформера.'
