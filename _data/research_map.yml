  abstract: Рассмотрена задача декодирования сигналов, представленн ых в виде синхронизированных временных рядов. В регрессионной задаче в осстановления значений целевого ряда по значениям исходного требуется сн изить размерность описания исходного сигнала. Предлагается способ сни жения размерности с помощью построения пространственно-временного предста вления предыстории сигнала в конформной геометрической алгебре. Такое пос троение опирается на свойство билинейности геометрического произведения алгебры. Искомое низкоразмерное представление в данном подходе получается из коэффициентов мультивектора алгебры, характеризующего последовате льность значений временного ряда. Предложенный метод применяется в решении задачи декодирования сигналов электрокортикограмм для восстановления траектории конечности.
