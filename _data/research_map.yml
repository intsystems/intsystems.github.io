  title: Оценка направленных взаимодействий в ЭЭГ через локальные якобианы в римановом пространстве ковариаций
  abstract: 'Оценка направленных взаимодействий (effective connectivity) по ЭЭГ затруднена из-за нелинейности нейродинамики, смешения источников и отсутствия истинного графа связей. В работе предлагается геометрически корректный пайплайн, в котором многоканальная ЭЭГ преобразуется в траекторию SPD-матриц ковариаций, вычисленных на скользящих окнах, и отображается в касательное пространство с помощью логарифмического отображения. Для оценки направленных влияний применяется метод S-map (Empirical Dynamic Modeling): локально-взвешенная линейная регрессия да- ёт матрицу коэффициентов, интерпретируемую как локальный якобиан динамики ковариационного состояния. Качество оценок проверяется без ground truth через предсказательную валидацию, test–retest воспроизводимость и суррогатные null-тесты; при необходимости CCM используется как дополнительный инструмент causal discovery/проверки направленности. Подход позволяет получать интерпретируемые, зависящие от состояния оценки направленных взаимодействий
    в ЭЭГ.'
