  abstract: В практических инженерных и оптимизационных приложениях решение задач многоцелевой оптимизации (МО) часто подразумевает использование методов скаляризации – сведение задачи МО к задаче с одной целевой функцией. Хоть известные подходы могут и быть эффективными, они часто сопряжены со значительными вычислительными затратами из-за необходимости итеративных вычислений, а также их использование усложняется необходимостью подбора гиперпараметров. В этой работе предлагается расширить определение конкурентного решения и построить на его основе метод скаляризации многокритериальной задачи. Предложенный метод имеет хорошую интерпретируемость и не требует настройки гиперпараметров. Для предложенного метода скаляризации предлагается способ получения приближенного решения в случае, когда функции липшицевы и их вычисление возможно только один раз. Это актуально, когда вычисления очень дорогие или повторное вычисление невозможно. Вычислительные эксперименты, проведенные для задачи конкурирующих
    потоков минимальной цены, демонстрируют работоспособность и масштабируемость предложенного подхода, подчеркивая его потенциал для решения вычислительных проблем в МО в различных областях.
