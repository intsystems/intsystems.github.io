  abstract: 'Решается задача классификации, рассматривается метод бустинга глубоких нейросетевых моделей. Классические методы бустинга неприменимы для глубоких нейросетей из-за того, что каждая модель достигает нулевой ошибки на обучающей выборке, следовательно невозможно обучить следующую модель компенсировать ошибки предыдущих моделей, чего требует большинство алгоритмов бустинга. В работе вводится дисконтированная функция потерь, которая решает две задачи: повышение генерализации каждой модели и добавление гибкости в обучении ансамбля, то есть создание возможности учитывать ошибки моделей. Последнее требование выполняется за счет оценки уверенности модели в предсказании, данная оценка называется марджин. Дисконтированная функция потерь позволяет обучать модель с предсказуемым значением марджина. Проводится вычислительный эксперимент, на датасетах CIF AR10 и CIF AR100, где предлагаемый метод бустинга превосходит базовое решение, классический глубокий ансамбль через усреднение предсказаний,
    до 3.2%.'
