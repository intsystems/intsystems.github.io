  abstract: Исследуется проблема прогнозирования распределения тематик в медиапотоке. Показано, что классические регрессионные подходы прогнозирования неустойчивы к появлению нерегулярных циклических циклических изменений с переменным периодом. Предлагается метод ARFilter, который повышает точноть регрессионных моделей с помощью выделения подмножества слов словаря, коррелирующих с временным распределением соответствующих тематик. Для отобранных слов строятся локальные прогнозы их нормированных долей, которые затем агрегируются в прогноз распределения тематик. На синтетических данных метод снижает ошибку прогноза в десять раз по сравнению с базовым подходом ARIMA. Разработанный подход не зависит от выбора конкретной авторегрессионной модели и эффективен для прогнозирования высоковолатильных тематических распределений.
