  abstract: В работе рассмотрена задача классификации многомерных тра екторий физических систем. Классические методы для классификации тр аекторий как многомерных временных рядов используют предположения о ст атистических свойствах траекторий, но не используют априорную информац ию, что временные ряды являются траекториями динамических систем, по дчиняющихся физическим законам и неустойчивы к нефизическим изменения м траекторий. Для учета таких изменений требуется дополнительно обучать модели на аугментированной выборке. Целью работы является предложить м етод для классификации многомерных временных рядов, использующие инфо рмацию об их физической природе. Для этого предлагается классифициров ать не сами траектории, а динамические системы, заданные лагранжианами, соответствующие этим траекториям. Лагранжиан восстанавливается с помо щью физическиинформированных лагранжевых нейронных сетей. Предложена норма, которая вводится на пространстве лагранжианов. Она используется к ак метрика для метрических
    методов классификации. В основном для многоме рных классификаций используется сверточные нейронные сети, в предполож ении, что существуют статистические связи, между ближайшими точками вре менного ряда. Данные методы хорошо себя показывают во многих задачах, где эти связи являются преобладающими. Но для физических систем такие мето ды не подходят, и предлагается использовать знания о физических связях сис тем, для выбранных Лагранжевых нейронных сетей этим знанием является зако н сохранения энергии.
