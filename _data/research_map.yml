  title: Optimization algorithms based on non-spectral matrix norms for neural network training
  abstract: В настоящей работе исследуется применение различных матричных норм для оптимизации функций матриц весов, что является ключевой задачей при обучении глубоких нейросетей. Проводится поиск альтернатив спектральной норме для создания алгоритмов оптимизации в рамках подходаnorm-constrained linear minimization oracle (LMO). При помощи данного подхода в 2025 году научным сообществом уже были получены высокоэффективные алгоритмы для обучения глубоких нейронных сетей Muon и Scion, которые, однако, опирались именно на спектральную норму. На основе норм, двойственных к нормам Ки Фана, вводится семейство алгоритмовFanions, связанных с алгоритмами Muon, ν-SAM и Dion, а также семейства алгоритмовF-FanionsиS-Fanions, обновления которых представляют собой конические комбинации обновлений алгоритмов Fanions и Normalized SGD или SignSGD соответственно. Наиболее успешными на практике алгоритмами в данных семействах являются Muon, F-Muon и S-Muon. По результатам обширного эмпирического исследования
    всех трёх семейств алгоритмов показывается, что F-Muon и S-Muon не уступают Muon на задачах глубокого обучения и превосходят его на синтетической гладкой выпуклой задаче.
