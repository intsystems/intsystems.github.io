  abstract: В работе рассматривается задача выбора архитектуры модели глубокого обучения (NAS) с контролем характеристик на заранее неизвестном целевом устройстве. Предлагается метод, сочетающий точность модели и эффективность аппаратного исполнения. Рассматриваемый подход основан на дифференцируемом поиске архитектур (DARTS), в котором оптимизируются структурные параметры градиентными методами путём релаксации дискретной задачи к непрерывной. В отличие от базового подхода, в предлагаемом методе архитектурные параметры сети задаются как функции векторного параметра сложности. Его компоненты трактуются как штрафы за соответствующие операции, что обеспечивает детальный контроль структуры модели. Для совместного обучения весов и архитектуры используется распределение Gumbel-Softmax — непрерывная аппроксимация категориального распределения, позволяющая оптимизировать дискретный выбор операций градиентными методами. Кроме того, задействуются гиперсети — вспомогательные нейросети, которые по заданному
    вектору сложности генерируют веса для основной сети. Такое сочетание даёт возможность одновременно оптимизировать несколько архитектур на разных уровнях сложности в рамках одного обучения, формируя семейство моделей, адаптированных к разнообразным вычислительным ресурсам. Эксперименты на CIFAR-10 и Fashion-MNIST показывают, что метод эффективно находит архитектуры, обеспечивающие компромисс между точностью и задержкой на целевом оборудовании.
