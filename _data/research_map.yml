  title: Heterogenous Knowledge Distillation
  abstract: We present a cross-architecture knowledge distillation method for transferring information between heterogeneous networks such as RNNs and CNNs. The key challenge is that their intermediate representations have different structure and depth, so a fixed, hand-crafted layer correspondence is often unreliable. Our approach learns a soft, input-dependent alignment between teacher and student layers, automatically deciding which internal components should match for each sample. Training augments the usual supervised objective with an additional term that encourages the student’s internal representations to become closer to the teacher’s under this learned alignment, while allowing different normalization choices depending on which model acts as the teacher.
