  title: Distillation Inductive Bias
  abstract: В работе рассматривается задача переноса индуктивного смещения в моделях глубокого обучения как задача дистилляции знаний. Под индуктивным смещением понимается совокупность предположений, которые модель явно или неявно использует для успешного обобщения на данных заданной структуры. Предлагается метод передачи индуктивного смещения из более сложных моделей, таких как рекуррентные и свёрточные нейронные сети, в более простую архитектуру многослойного перцептрона посредством дистилляции знаний. Проверка работоспособности предложенного метода проводится на дистилляции CNN-модели в MLP. Целью является придания полносвязной сети локальной инвариантности, характерной для свёрток. Показано, что использование дистилляции способствует улучшению качества модели ученика и повышает скорость сходимости параметров к оптимальным значениям по сравнению с традиционным обучением без дистилляции. Таким образом, предложенный подход демонстрирует эффективный способ внедрения индуктивного смещения
    сложных моделей в более простые архитектуры, повышая при этом интерпретируемость и качество итоговой модели MLP.
