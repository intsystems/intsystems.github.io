  abstract: Аннотация — Гессиан нейронной сети является важным аспектом для понимания ландшафта потерь и характеристики сетевой архитектуры. Матрица Гессе фиксирует важную информацию о кривизне, чувствительности и локальном поведении функции потерь. Наша работа предлагает метод, который улучшает понимание локального поведения функции потерь и может использоваться для анализа поведения нейронных сетей, а также для интерпретации параметров в этих сетях. В этой работе мы рассматриваем подход к исследованию свойств глубокой нейронной сети с использованием Гессеана. Мы предлагаем метод оценки нормы матрицы Гессе для определенного типа нейронных сетей, таких как сверточные. Мы получили результаты как для одномерных, так и для двумерных сверток, а также для полностью связанной головы в этих сетях. Наш эмпирический анализ подтверждает эти выводы, демонстрируя сходимость в ландшафте функции потерь. Мы оценили гессианскую норму для нейронных сетей, представленных как произведение матриц, и рассмотрели,
    как эта оценка влияет на ландшафт функции потерь.
