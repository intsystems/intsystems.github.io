  abstract: Решается задача выбора модели прогнозирования квазипери­ одических временных рядов. Классические методы оценки эффек­ тивности прогнозирования не учитывают предысторию и априорное знание о периодичности временных рядов. Для учета этой информа­ ции применяется модель фазовой траектории исследуемого времен­ ного ряда. Для перехода в фазовое пространство временной ряд век­ торизуется с помощью метода задержек. Для понижения сложности модели в фазовом пространстве выбирается подпространство. Про­ екция фазовой траектории на сферу в полученном подпространстве аппроксимируется линейной комбинацией сферических гармоник. Полученная модель оценивает вероятность принадлежности точек фазовой траектории исследуемому временному ряду. Дополнитель­ но свойства модели фазовой траектории были исследованы в задаче классификации. По полученным оценкам вероятности предлагается метод выбора наилучшей модели прогнозирования. Вычислитель­ ный эксперимент проведен на измерениях акселерометра мобильно­
    го устройства с тремя классами движений человека.
