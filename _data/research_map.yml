  abstract: Состязательные мосты Шрёдингера на задаче трансляции домена Ксенофонтов Григорий Сергеевич В магистерской диссертации рассматривается задача трансляции домена. ЦельюисследованияявляетсяразработкановогометодарешениизадачимостовШрёдингера, который находит одноэтапное отображение, а также справляется с данными большой размерностью. Так в работе предложен новый подход, который находит решения задачи мостов Шрёдингера с помощью состязательного обучения, таким образом объединяя преимущества состязательных генеративных сетей (GAN) и мостов Шрёдингера. В данной работе проводятся эксперименты предложенного подхода на различных наборах данных, включая 2D данные и EMNIST. Полученные результаты показывают, что предложенный метод удовлетворяет всем поставленным требованиям и предлагает новый фреймворк для решения задачи мостов Шрёдингера. Abstract Adversarial Schr¨ odinger bridges on domain translation problem The master’s thesis examines the domain translation problem. The goal of the research
    is to develop a new method for solving the Schr¨ odinger bridge problem, which finds a one-stagemappingandalsocopeswithhigh-dimensionaldata.Thus,thepaperproposes a new approach that finds solutions to the Schr¨ odinger bridge problem using adversarial learning, thus combining the advantages of adversarial generative networks (GANs) and Schr¨ odinger bridges. In this work, experiments of the proposed approach are carried out on various datasets, including 2D data and EMNIST. The results obtained show that the proposed method satisfies all the stated requirements and offers a new framework for solving Schr¨ odinger bridges problem.
