  title: Text Interfaces for Event Sequences
  abstract: In recent years, large language models (LLMs) have made significant progress in natural language processing. It has been observed that these models may exhibit reasoning abilities when are sufficiently large. One piece of evidence supporting this claim is the ability of LLMs to solve a wide variety of tasks, including making summaries, answering questions, sentiment classification, and more. This ability of LLMs has been further explored in prompt engineering, where an LLM can learn to solve new tasks in a zero- or few-shot format by directly typing a question and receiving the answer in text form. In this work, we introduce text interfaces for event sequence data. Text interfaces are interfaces that enable interaction between a user and a model using textual input and output. Through text interfaces, we were able to extract information from sequence data and use this data to solve different tasks. One benefit of this approach is that it is possible to solve multiple tasks simultaneously.
    The results produced by the text interface model are compatible with the best classical learning format models, demonstrating its efficiency.
