  title: Методы оптимизации, устойчивые к тяжелым шумам
  abstract: "In recent years, non-convex optimization problems are more often described by generalized (L0, L1)-smoothness assumption rather than standard one. Meanwhile, severely corrupted data used in these problems has increased the demand for methods capable of handling heavy-tailed noises, i.e., noises with bounded κ-th moment. Motivated by these real-world trends and challenges, we explore sign-based methods in this setup and demonstrate their effectiveness in comparison with other popular solutions like clipping or normalization. In theory, we prove the first-known high probability convergence bounds under (L0, L1)smoothness and heavy-tailed noises with mild parameter dependencies. In the case of standard smoothness, these bounds are novel for sign-based methods as well. In particular, SignSGD with batching achieves sample complexity ˜O \x12\x12 ∆L0d ε2 + ∆L1d 3 2 ε \x13 h 1 + \0 σ ε \x01 κ κ−1 i\x13 , κ∈ (1, 2]. Under the assumption of symmetric noises, SignSGD with Majority V oting\
    \ can robustly work on the whole range of κ ∈ (0, 2] with complexity ˜O \x12\x12 ∆L0d ε2 + ∆L1d 3 2 ε \x13 h 1 κ2 + σ2ε2 i\x13 . We also obtain results for parameter-agnostic setups, Polyak-Lojasiewicz functions and momentum-based methods (in expectation). Our theoretical findings are supported by the superior performance of sign-based methods in training Large Language Models compared to clipping and normalization."
