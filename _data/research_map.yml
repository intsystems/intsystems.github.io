  title: Геометрический подход к оценке сложности данных на основе генеративных диффузионных моделей
  abstract: 'Качество модели машинного обучения определяется не только объёмом обучающей выборки, но и тем, сколько различной информации она несёт: две выборки одного размера могут заметно различаться по разнообразию, а с ним и по сложности задачи обучения. Существующие меры сложности данных описывают лишь локальную размерность или не улавливают семантическую геометрию порождающего распределения. В работе изучаются меры сложности выборки, не требующие разметки, а само понятие сложности формализуется через три требования из теории меры: инвариантность к перестановкам, субаддитивность и монотонность. Доказано достаточное условие корректности меры и установлены точные двусторонние границы на прирост сложности при добавлении одного объекта. Чтобы вычислить меру на реальных данных, используется предобученная диффузионная модель. Объект представляется всей своей траекторией зашумления и тем самым сравнивается с другими сразу на всех масштабах, а порождаемое расстояние является метрикой и отражает
    семантическую близость объектов. Эксперименты на смесях гауссиан и на изображениях MNIST подтверждают, что мера отражает семантическое разнообразие, а не объём выборки.'
