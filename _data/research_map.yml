  abstract: Работа посвящена задаче регуляризации параметров нейронной сети для уменьшения избыточности и повышения устойчивости модели. Предлагается модель нейросетевого слоя, основанная на представлении системы весов слоя в виде фрейма в пространстве параметров, что делает разложение входного сигнала по весам данного слоя устойчивым и полным. На основе предложенной модели вводится фреймовая регуляризация параметров слоя в виде штрафа за несоблюдение достаточного условия фрейма. В отличие от существующих методов, основанных на ортогонализации, предложенная ортогонализация накладывает слабые ограничения на параметры модели, которые достаточны для восстановления входа слоя по его выходу. Предложенный метод регуляризации эффективно обобщается на сверточные слои в блочно-теплицевом представлении. Вычислительный эксперимент, проведенный на выборках CIFAR-10, CIFAR-100 и SVHN, показал эффективность предложенного метода регуляриации с точки зрения качества обученных моделей из класса сверточных
    нейронных сетей. Модели, обученные с фреймовой регуляризацией параметров, обладают большей точностью классификации, обобщающей способностью и устойчивостью к состязательным атакам по сравнению с базовыми подходами. **Ключевые слова:** регуляризация параметров, нейронная сеть, фрейм, ортогонализация весов.
