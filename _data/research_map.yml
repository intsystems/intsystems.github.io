  title: Tverberg type theorems
  abstract: In 1966, Helge Tverberg [ 1] proved that for any (r − 1)(d + 1) + 1 points in Rd, there exists a partition of them into r parts whose convex hulls intersect. Recently, Adiprasito et al. [2] initiated the study of the no-dimensional Tverberg theorem, where the size of the point set does not depend on the dimension at a cost of a relaxed intersection requirement. This thesis presents no-dimensional Tverberg results for point sets in certain non-Euclidean spaces. Secondly, this paper studies a variation of the Tverberg’s theorem introduced by Huemer et al. [ 3] and Soberón and Tang [ 4]. Specifically, we generalize the result of Abu-Affash et al. [5] concerning Tverberg graphs in the plane to higher dimensions. Finally, we explore applications of the two approaches developed for proving Tverbergtype results. We use an optimization approach to improve bounds on the cost of a maximum matching in the plane. Using the Sarkaria’s method [ 6], we introduce a new multi-class classification
    model for non-linear data.
