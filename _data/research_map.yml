  abstract: 'Данная работа посвящена задаче Propaganda Detection. Задача выявления пропаганды в новостях на английском языке упоминалась впервые в 2017[1], в 2019 [2]. В работе [3] задача Propaganda Detection была поставлена как две независимые подзадачи обработки естественного языка: Span Identification и Text Classification, а также были предложены метрики качества и базовые модели. В бакалаврской работе предлагается расширение задачи обнаружения пропаганды - добавление подзадачи Span Targetting, размеченный русскоязычный корпус новостей и модели для решения задачи Propaganda Detection на русском языке. Задача Span Targetting подразумевает под собой поиск мишени на которую направлен фрагмент манипуляции. Собранный датасет представляют собой набор новостных статей, которые были размечены экспертами в области лингвистики, социологии и политических наук. Разработанные базовые модели для решения задачи Propaganda Detection на русском языке представляют собой большие лингвистические модели
    на основе архитектуры трансформер дообученные на специализированные задачи обработки естественного языка Span Targetting и Span Identification. Глава'
