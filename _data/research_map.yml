  title: 'TransPointRank: Global Learning to Rank with Attention'
  abstract: In ranking tasks, gradient boosting has long been the preferred approach over neural networks, with increasingly complex loss functions emerging each year to directly optimize specific metrics. However, we combined one of the earliest loss functions with a lightweight transformer and achieved results that significantly outperform gradient boosting. Furthermore, our method substantially improves upon previous attempts to apply transformers to ranking problems. While transformers can achieve very high metric scores, this often requires a large number of epochs. We address this issue by enhancing the training approach for our neural network.
