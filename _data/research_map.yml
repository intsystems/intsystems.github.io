  abstract: Интерфейсы мозг-компьютер (ИМК) - это быстро развивающаяся область исследований, которая помогает восстановливать двигательные способности. Современные данные ИМК содержат измерения с множе­ ствасигналов.Этисигналыизбыточныисильнокоррелируюткакповре­ менной, так и по пространственной координатам. Это приводит к неста­ бильности моделей. Поэтому используются методы уменьшения размер­ ности. Многие методы уменьшения размерности не могут учитывать корре­ ляцииповременнойипопространственнойкоординатам.Чтобывыявить эти корреляции, перед уменьшением размерности используется тензори­ зация. Одним из наиболее распространенных методов тензоризации вре­ менных рядов является ганкелизация. Ганкелизация помогает выявлять внутренние временные и пространственные корреляции. Однако этот ме­ тод не был использован в задаче прогнозирования в области ИМК. В этой работе мы нашли оптимальные тензорные представления при­ знаков и целевой переменной в скрытом пространстве, объединив ганке­ лизацию
    и методы уменьшения размерности. Мы протестировали ганке­ лизацию по времени, пространству и обоим измерениям. Кроме того, мы использовали несколько моделей уменьшения размерности, чтобы прове­ рить, дает ли ганкелизация улучшение качества для всех моделей. Этими моделямиявляютсямноголинейныйанализглавныхкомпонент(MPCA), метод частичных наименьших квадратов высокого порядка (HOPLS) и гибридный автоэнкодер. Результаты по трем наборам данных ИМК показали, что ганкелиза­ ция по пространственному измерению в наибольшей степени улучшает качество прогнозирования и упрощает тензор в скрытом пространстве для большинства случаев. Кроме того, в некоторых случаях наилучшим образом работает ганкелизация по обоим измерениям. Эти результаты показывают, что ганкелизация может улучшить качество прогнозирова­ ния в области ИМК.
