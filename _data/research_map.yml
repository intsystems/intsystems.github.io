  abstract: Матрицы ковариации многомерных временных рядов лежат в римановом пространстве SPD матриц. Свойства этого пространства используются для решения задач классификации многомерных временных рядов. Проблема использования этого же подхода для прогнозирования многомерных временных рядов заключается в том, что, в отличие от задач классификации, нет возможности решать задачу в пространстве SPD матриц. Предлагаются прогностические модели, использующие риманову геометрию SPD матриц, и исследуется качество их прогноза в зависимости от свойств прогнозируемых временных рядов. Основные свойства, препятствующие повышению качества прогноза, являются потеря информации о фазе сигнала при вычислении матриц ковариации и отсутствие явной зависимости будущих значений временных рядов от ковариаций. Предлагается метод обнаружения и оценки эффекта потери фазовой информации, основанный на методе перекрестного сходящегося отображения. На синтетическом наборе временных рядов с особыми свойствами достигается
    повышение качества прогноза, иллюстрируя важность выдвинутых предположений.
