  title: Analyzing large-dimensional data with a small sample size
  abstract: 'Задача анализа данных большой размерности в условиях малого числа объектов и пропусков в признаках особенно актуальна в медицине, где число обследованных пациентов невелико, а размерность признакового описания (анализы, ЭКГ, fMRI, EEG и т. д.) велика. В таком режиме (D > N) классические модели машинного обучения (бустинги, бэггинги, нейросети) применимы ограниченно: во-первых, они склонны к переобучению; вовторых, плохо интерпретируемы, что критично для медицинских ассистентов, где врачу важно понимать, какая именно аномалия указывает на заболевание, а не получать одну лишь вероятность. В работе исследуется один из интерпретируемых методов снижения размерности — синолитические и паренклитические сети. Дана их вероятностная интерпретация, подходы обобщены на взаимодействия признаков высших порядков (через симметризацию цепного правила и обращение Мёбиуса), а их свойства проверены на синтетических датасетах с контролируемой степенью взаимозависимости признаков. Показано, что качество
    извлекаемых из графа признаков сопоставимо с тяжёлыми графовыми нейросетями (SGNN) и превосходит небографовые бейзлайны (XGBoost) на ряде биомедицинских задач. Новизна работы заключается в: 1) вероятностной теории паренклитики и синолитики и её обобщении на взаимодействия порядкаk; 2) новых признаках на основе агрегированных условных log-плотностейk-го порядка; 3) исследовании устойчивости предложенных моделей к уменьшению размера выборки, зашумлению и добавлению шумовых признаков; 4) экспериментальном сравнении с подходом SGNN, показывающем, что замена их синолитического графа на предложенный нами в той же pipeline повышает macro ROC-AUC.'
