  abstract: Фокальная кортикальная дисплазия (ФКД) является одним из наиболее распространенных поражений головного мозга, вызывающих эпилепсию. Обычно она диагностируются рентгенологом при МРТ-сканировании головного мозга пациента. Её хирургическое удаление можетпривестикснижениюпотребностивпротивоэпилептическихпрепаратах,снижению частоты или к полному отсутствию приступов. Цель проекта — создать удобную и надежную систему для выявления врачом структурных изменений в коре головного мозга на основании данных МРТ. Представленное исследование посвящено использованию глубоких нейронныхсетейдляэтойзадачи.ПредлагаетсяиспользоватьфреймворкMinkowskiEngine для МРТ данных, представленных в виде облака точек. Полученный метод был применен к набору из 183 МРТ изображений пациентов с ФКД, собранных в сотрудничестве с медицинскимипартнерами.Такжевработепредставленосравнениессовременнымиподходами кобнаружениюФКД.
