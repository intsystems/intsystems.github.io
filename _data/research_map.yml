  abstract: В данной дипломной работе представлен новый генеративный процесс на специальной ортогональной группе SO(3), который является важным инструментом для моделирования вращений в трехмерном пространстве. Основное внимание уделено разработке и анализу этого процесса, а также доказательству его ключевых свойств, таких как сходимость и эквивариантность. В работе также приведены экспериментальные результаты, демонстрирующие преимущества предложенного генеративного процесса. На синтетических данных показано, что новый метод превосходит существующие подходы по точности и стабильности. Более того, проведенные эксперименты на реальной задаче условной генерации трехмерных структур молекул РНК подтверждают сходимость и практическую применимость предложенного процесса. Таким образом, предложенный генеративный процесс в пространстве SO(3) обладает значительным потенциалом для различных приложений в области молекулярной биологии и других сфер, требующих точного моделирования трехмерных структур.
