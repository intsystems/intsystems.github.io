  title: Distributed Newton-Type Methods with Communication Compression and Bernoulli Aggregation
  abstract: Данная магистерская диссертация основана на статье «Distributеd Nеwtоn-Type Mеthоds with Cоmmuniсаtiоn Сomprеssion and Bernоulli Aggregatiоn.» (?) за авторством Рустема Исламов, Шун Кяна, Славомира Хэнзли, Мера Сафаряна и Питера Рихтарика. Несмотря на высокие затраты на вычисления и передачу данных, методы типа Ньютон остаются одним из вариантом для распределенного обучения из-за их устойчивости к плохо обусловленным выпуклым задачам. В этой работе мы изучаем механизмы сжатия и агрегирования информации, чтобы снизить вышеупомянутые затраты при сохранении теоретических гарантий локальной сходимости. Мы доказываем, что недавно разработанный класс 3PC-компрессоров (?) для компрессии градиентов может быть обобщен и на компрессию гессианов. Этот результат открывает широкий спектр коммуникационных стратегий, таких как сжимающие операторы компрессии и ленивая агрегация, доступных в нашем распоряжении для компрессии чрезмерно дорогостоящей информации о кривизне функций. Более того, мы
    обнаружили несколько новых 3PC-механизмов, таких как адаптивно пороговый оператор и агрегирование Бернулли, которые требуют уменьшенное число итераций передачи и вычислений гессианов. Кроме того, мы распространяем и анализируем наш подход на двухстороннюю компрессию и частичного участия клиентов, чтобы учесть практические аспекты в федеративном обучении. Для всех наших методов мы получаем быстрые, не зависящие от числа обусловленности локальные линейные и/или сверхлинейные скорости сходимости. Наконец, проведя обширные численные эксперименты на задачах выпуклой оптимизации, мы иллюстрируем, что разработанные нами схемы обеспечивают наилучшую коммуникационную сложность по сравнению с несколькими предыдущими подходами, использующими информацию второго порядка.
