  title: Multimodal approximation of fMRI data based on audiovisual stimuli
  abstract: 'Рассматривается мультимодальное обобщение линейной задачи прогнозирования фМРТ , в которой последовательность воксельных снимков восстанавливается одновременно по видео иа у д и о п о т о к ун а т у р а л и с т и ч н о г оа у д и о в и з у а л ь н о г ос т и м у л а. Подход развивается в три этапа возрастающей методологической сложности . Отправной точкой служит одномодальная базо вая модель, предсказывающая BOLD-сигнал по мел-частотным кепстральным коэффициентам (MFCC) звуковой дорожки. Затем вводится мультимодальная модель на основе гребневой регрессии с раздельными поблочными штрафами (banded ridge), которая объединяет аудио эмбеддинг со сжатым по размерности методом главных компонент (PCA) видеоэмбеддингом и назначает каждой модальности отдельный коэффициент регуляризации , такой анализ выявляет пространственную неоднородность вкладов аудио и видео в BOLD-сигнал. Однако, наивная конкатенация переоценивает более высокоразмерный поток и смешивает относитель ные вклады двух
    модальностей , ас а м ам о д е л ьо г р а н и ч е н аа р х и т е к т у р н о йа с и м м е т р и е йм е ж д у низкоразмерным аудиопредставлением, сконструированным вручную, и высокоразмерным предобученным видеопредставлением . Чтобы устранить эту асимметрию , MFCC- кодировщик заменяется самообучаемым речевым трансформером той же размерности , что и видеокодиров щик, ип р е д л а г а е т с яп о в о к с е л ь н а яgated-модель: на каждой модальности независимо обучается гребневая регрессия , а два предсказания комбинируются через повоксельный скалярный гейт ↵ijk 2 [0,1]. Оптимальный гейт выводится аналитически в замкнутой форме как наклон одномерной регрессии методом наименьших квадратов , усечённый на единичный отрезок [0,1]. Полученная модель проверяется на публичном датасете натуралистичной стимуляции ЭЭГ–фМРТ, где gated-модель устойчиво превосходит обе одномодальные базовые'
