# Department students and supervisors without a profile. Rendered on /students/ by _includes/students.html.
# Updated by hand from the department's lists each semester.
#
# students:
#   id            lastname_ii as in _people/ (lastname_i while the patronymic is unknown);
#                 a student with a profile keeps its id, and the page links to it
#   name          {ru: Фамилия Имя Отчество, en: Name Surname}; ignored for profiles, which use _i18n/
#   track         one item per program, in order:
#     level       bachelor | master | phd
#     start       first semester at the department, an id from _data/schedule.yml (spring_2026, fall_2026);
#                 students may join in any semester
#     start_course  year of study in `start`; default bachelor 3, master 5, phd 1
#     end         last semester, once known
#     outcome     graduated | left; `left` is never shown
#     supervisors ids from _people/ or from `external`
#     topic       thesis topic, Russian
#   orcid, github, openreview  optional public ids; openreview is a list of profile ids (~Name_Surname1)
#                 and lives in _people/<id>.md instead when the person has a profile
#
# The current year of study is start_course plus the number of fall semesters after `start`, so it is never stored.
# Public: names, programs, supervisors, topics only. No grades, contacts, or jobs.

external:  # supervisors without a profile in _people/
