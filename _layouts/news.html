---
layout: default
---
<article class="news-post">
    <header class="news-post__header">
        <h1 class="page-heading">{{ page.title }}</h1>
        <p class="news-post__date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time></p>
    </header>
    <div>
        {{ content }}
    </div>
</article>
