name: Deploy Intelligent Systems Website to Pages

on:
  push:
    branches: ["main"]
  # Pull requests get a build check (no deploy) so broken changes are caught before merge
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys are serialized; PR builds run independently of each other
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Optimized images are cached by the hash of the ORIGINALS (evaluated
      # before optimization). On a hit the compressed set is restored and the
      # slow optimization step is skipped entirely.
      - name: Restore optimized images
        id: images-cache
        uses: actions/cache@v4
        with:
          path: images
          key: optimized-images-v1-${{ hashFiles('images/**') }}
      # Compress images at build time: originals stay untouched in the repo,
      # only the deployed site gets optimized copies. Contributors commit
      # plain jpg/png without any manual compression.
      - name: Optimize images
        if: steps.images-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jpegoptim pngquant imagemagick
          # Collect file lists up front: mogrify/jpegoptim create temp files
          # (".!NNN!name.jpg") in place, and a streaming `find | xargs` would
          # pick those up mid-run and fail on them.
          find images -type f -not -name '.*' \( -iname '*.jpg' -o -iname '*.jpeg' \) -print0 > /tmp/jpg.list
          find images/people -type f -not -name '.*' \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 > /tmp/people.list
          find images -type f -not -name '.*' -iname '*.png' -print0 > /tmp/png.list
          # Cap dimensions: photos never render wider than ~1920px (avatars at 300px)
          xargs -0 -r mogrify -resize '1920x1920>' -auto-orient < /tmp/jpg.list
          xargs -0 -r mogrify -resize '600x600>' < /tmp/people.list
          # Lossy-but-visually-safe compression
          xargs -0 -r jpegoptim --max=82 --strip-all --quiet < /tmp/jpg.list
          xargs -0 -r -n 50 pngquant --quality=70-90 --speed 1 --ext .png --force --skip-if-larger < /tmp/png.list || true
          du -sh images
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
